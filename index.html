<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Sounds & Facts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121824;
      color: #ffffff;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      color: #f59e0b;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #9ca3af;
      font-size: 1.1rem;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 25px;
      border: 2px solid #374151;
      background-color: #1f2937;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: #f59e0b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background-color: #1f2937;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.2);
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    .name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f3f4f6;
      margin-bottom: 0.5rem;
    }

    .desc {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .sound-btn {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    .sound-btn:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <header>
    <h1>🐾 Animal Sounds & Facts</h1>
    <p class="subtitle">Click on any animal to listen to its natural sound and learn facts!</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search animal (e.g. Lion, Elephant)..." onkeyup="filterAnimals()">
  </div>

  <div class="grid" id="animalGrid"></div>

  <script>
    const animals = [
      {
        name: "Lion",
        emoji: "🦁",
        desc: "Lions are known as the kings of the jungle. Their loud roars can be heard up to 8 km away.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/lion_roar.ogg"
      },
      {
        name: "Dog",
        emoji: "🐶",
        desc: "Dogs are loyal domestic animals known for their incredible sense of smell and hearing.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/dog_barking.ogg"
      },
      {
        name: "Cat",
        emoji: "🐱",
        desc: "Cats are playful pets. They communicate using meows, purrs, and body language.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/cat_purr.ogg"
      },
      {
        name: "Rooster",
        emoji: "🐓",
        desc: "Roosters are male chickens known for crowing at dawn to mark their territory.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/rooster_crowing.ogg"
      },
      {
        name: "Cow",
        emoji: "🐮",
        desc: "Cows are gentle farm animals that produce nutritious milk enjoyed worldwide.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/cow_moo.ogg"
      },
      {
        name: "Frog",
        emoji: "🐸",
        desc: "Frogs are amphibians that can live on land and in water. They croak loudly near rivers.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/frog_croak.ogg"
      },
      {
        name: "Wolf",
        emoji: "🐺",
        desc: "Wolves live and hunt in organized packs and communicate using powerful howls.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/wolf_howling.ogg"
      },
      {
        name: "Owl",
        emoji: "🦉",
        desc: "Owls are nocturnal birds of prey with sharp vision and hooting sounds at night.",
        soundUrl: "https://actions.google.com/sounds/v1/animals/owl_hoot.ogg"
      }
    ];

    let currentAudio = null;

    function renderAnimals(data) {
      const grid = document.getElementById("animalGrid");
      grid.innerHTML = "";

      data.forEach(animal => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div>
            <div class="emoji">${animal.emoji}</div>
            <div class="name">${animal.name}</div>
            <div class="desc">${animal.desc}</div>
          </div>
          <button class="sound-btn" onclick="playSound('${animal.soundUrl}', '${animal.name}')">
            🔊 Listen Sound
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function playSound(url, name) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      currentAudio = new Audio(url);
      currentAudio.play().catch(error => {
        console.log("Fallback speech synthesis triggered");
        const utterance = new SpeechSynthesisUtterance(name + " sound!");
        speechSynthesis.speak(utterance);
      });
    }

    function filterAnimals() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = animals.filter(a => a.name.toLowerCase().includes(query) || a.desc.toLowerCase().includes(query));
      renderAnimals(filtered);
    }

    // Initial Render
    renderAnimals(animals);
  </script>
</body>
</html>
